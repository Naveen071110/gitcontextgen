name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions UI

jobs:
  ping-supabase-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Supabase Heartbeat Ping
        run: |
          echo "Sending keep-alive ping to GitContextGen Supabase Heartbeat API..."
          TARGET_URL="${{ secrets.APP_DOMAIN_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://repopulse-ai.singhnaveen360.workers.dev"
          fi
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$TARGET_URL/api/keepalive")
          echo "Response Output:"
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F: '{print $2}')
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✓ Supabase keep-alive heartbeat successful! HTTP 200 OK."
          else
            echo "⚠️ Heartbeat returned HTTP status $HTTP_STATUS"
          fi
